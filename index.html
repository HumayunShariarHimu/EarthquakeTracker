<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EarthquakeTracker</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-red: #ff0055;
            --neon-green: #39ff14;
            --bg-dark: #000000;
            --panel-width: 350px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Consolas', monospace; background: var(--bg-dark); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Alarm System */
        #alarm-system {
            display: none; background: var(--neon-red); color: white; padding: 10px;
            text-align: center; font-weight: bold; position: fixed; top: 0; width: 100%; z-index: 10000;
            box-shadow: 0 0 20px var(--neon-red); animation: blink 0.5s infinite;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        header { 
            background: #000; padding: 12px; text-align: center; border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue); z-index: 2000; display: flex; justify-content: space-between; align-items: center;
        }

        header h1 { font-size: 1.2rem; flex: 1; }

        /* Sidebar Navigation Button (Mobile) */
        #menu-toggle {
            display: none; background: none; border: 1px solid var(--neon-blue); color: var(--neon-blue);
            padding: 8px 12px; cursor: pointer; border-radius: 4px; z-index: 3000;
        }

        #main-container { display: flex; flex: 1; position: relative; overflow: hidden; }

        /* Map Section */
        #map-area { flex: 1; position: relative; }
        #map { height: 100%; width: 100%; }

        .map-switch {
            position: absolute; top: 15px; right: 15px; z-index: 1000; display: flex; gap: 5px;
        }
        .map-switch button {
            background: rgba(0,0,0,0.8); color: var(--neon-blue); border: 1px solid var(--neon-blue);
            padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.7rem;
        }
        .map-switch button.active { background: var(--neon-blue); color: #000; }

        /* Sidebar Panel (Responsive) */
        #data-panel { 
            width: var(--panel-width); 
            background: rgba(5, 5, 5, 0.95); 
            display: flex; 
            flex-direction: column; 
            border-left: 1px solid #222;
            transition: transform 0.3s ease-in-out;
            z-index: 2500;
        }

        .stat-box { padding: 15px; border-bottom: 1px solid #222; }
        .stat-box h3 { color: var(--neon-blue); font-size: 0.8rem; margin-bottom: 10px; text-transform: uppercase; }

        .loc-info { font-size: 0.7rem; color: #aaa; line-height: 1.6; background: #0a0a0a; padding: 10px; border-radius: 5px; }
        .loc-info b { color: var(--neon-green); }

        /* Risk Bar */
        .risk-container { margin: 15px 0; }
        .risk-bar { height: 8px; background: #111; border-radius: 4px; border: 1px solid #333; overflow: hidden; }
        #risk-fill { height: 100%; width: 0%; background: var(--neon-green); transition: 2s; box-shadow: 0 0 10px var(--neon-green); }

        /* Feed List */
        #feed-list { flex: 1; overflow-y: auto; padding: 10px; }
        .quake-card {
            background: #0d0d0d; border: 1px solid #1a1a1a; padding: 12px; margin-bottom: 10px;
            border-left: 4px solid var(--neon-blue); border-radius: 4px; cursor: pointer;
        }
        .quake-card:hover { background: #111; border-color: var(--neon-blue); }
        .quake-card.high-mag { border-left-color: var(--neon-red); }
        .quake-card h4 { font-size: 0.8rem; color: #fff; margin-bottom: 5px; }
        .quake-card p { font-size: 0.65rem; color: #777; }

        /* Mobile Specific Styles */
        @media (max-width: 768px) {
            #menu-toggle { display: block; position: fixed; bottom: 20px; left: 20px; background: #000; }
            #data-panel {
                position: fixed;
                top: 0;
                right: 0;
                height: 100%;
                transform: translateX(100%); /* ডিফল্টভাবে ডানে লুকানো থাকবে */
                box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            }
            #data-panel.active {
                transform: translateX(0); /* ক্লিক করলে সামনে আসবে */
            }
            header h1 { font-size: 0.9rem; }
            #clock { display: block; font-size: 0.8rem; }
        }

        /* Close button for mobile sidebar */
        #close-panel {
            display: none;
            padding: 10px;
            text-align: right;
            color: var(--neon-red);
            cursor: pointer;
        }
        @media (max-width: 768px) { #close-panel { display: block; } }
    </style>
</head>
<body>

<div id="alarm-system">⚠️ এলার্ম: নিকটবর্তী এলাকায় শক্তিশালী কম্পন শনাক্ত! ⚠️</div>

<header>
    <h1>EarthquakeTracker<span id="clock" style="color:var(--neon-green); margin-left:15px;">00:00:00</span></h1>
</header>

<div id="main-container">
    <div id="map-area">
        <div id="map"></div>
        <div class="map-switch">
            <button id="btn-neon" class="active" onclick="changeLayer('neon')">Map</button>
            <button id="btn-sat" onclick="changeLayer('sat')">SAT</button>
        </div>
        <button id="menu-toggle" onclick="toggleSidebar()">🧭 </i>DATA</button>
    </div>

    <div id="data-panel">
        <div id="close-panel" onclick="toggleSidebar()"><i class="fas fa-times"></i>Close</div>
        
        <div class="stat-box">
            <h3>🌍 </i> Live Location Graph</h3>
            <div class="loc-info">
                LAT: <b id="lat">0.00</b> | LON: <b id="lon">0.00</b><br>
                ALT: <b id="alt">0.0 m</b> | ACC: <b id="acc">0 m</b>
            </div>
        </div>

        <div class="stat-box">
            <h3>💥 </i>Risk Prediction</h3>
            <div style="display:flex; justify-content:space-between; font-size:0.7rem;">
                <span id="risk-status">Analyzing...</span>
                <span id="risk-val" style="color:var(--neon-green)">0%</span>
            </div>
            <div class="risk-container">
                <div class="risk-bar"><div id="risk-fill"></div></div>
            </div>
        </div>

        <div id="feed-list">
            <p style="text-align:center; color:#333; padding:20px;">Loading...</p>
        </div>
    </div>
</div>

<audio id="alarm-audio" src="./sound.wav" loop></audio>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map, neonLayer, satLayer;
    let uLat = 0, uLon = 0;
    let markers = [];

    function init() {
        map = L.map('map', { zoomControl: false }).setView([20, 0], 2);
        
        neonLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        satLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}');

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(p => {
                uLat = p.coords.latitude;
                uLon = p.coords.longitude;
                document.getElementById('lat').innerText = uLat.toFixed(4);
                document.getElementById('lon').innerText = uLon.toFixed(4);
                document.getElementById('alt').innerText = (p.coords.altitude || 0).toFixed(1) + " m";
                document.getElementById('acc').innerText = p.coords.accuracy.toFixed(0) + " m";
                L.circleMarker([uLat, uLon], { radius: 8, color: '#00f3ff', fillOpacity: 0.8 }).addTo(map);
            }, null, { enableHighAccuracy: true });
        }

        fetchQuakeData();
        setInterval(fetchQuakeData, 30000);
    }

    // স্লাইডবার টগল করার ফাংশন
    function toggleSidebar() {
        document.getElementById('data-panel').classList.toggle('active');
    }

    function changeLayer(type) {
        if(type === 'sat') {
            map.addLayer(satLayer); map.removeLayer(neonLayer);
            document.getElementById('btn-sat').className = 'active';
            document.getElementById('btn-neon').className = '';
        } else {
            map.addLayer(neonLayer); map.removeLayer(satLayer);
            document.getElementById('btn-neon').className = 'active';
            document.getElementById('btn-sat').className = '';
        }
    }

    async function fetchQuakeData() {
        try {
            const res = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson');
            const data = await res.json();
            processQuakes(data.features);
        } catch (e) { console.log("Data error"); }
    }

    function processQuakes(quakes) {
        const feed = document.getElementById('feed-list');
        feed.innerHTML = "";
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        let highestRisk = 0;
        let alarmTriggered = false;

        quakes.forEach(q => {
            const [lon, lat] = q.geometry.coordinates;
            const mag = q.properties.mag;
            const place = q.properties.place;
            const dist = getDistance(uLat, uLon, lat, lon);

            if (dist < 500 && mag > 4.0) alarmTriggered = true;
            if (dist < 1000) {
                let riskIndex = (mag * (1 - dist/1000));
                if (riskIndex > highestRisk) highestRisk = riskIndex;
            }

            let color = mag > 5.5 ? '#ff0055' : mag > 4 ? '#ffaa00' : '#39ff14';
            let marker = L.circle([lat, lon], {
                radius: mag * 25000, color: color, weight: 2, fillOpacity: 0.2
            }).addTo(map);
            
            marker.bindPopup(`<b>Magnitude: ${mag}</b><br>${place}<br>${dist.toFixed(0)} km দূরে`);
            markers.push(marker);

            const card = document.createElement('div');
            card.className = `quake-card ${mag > 5 ? 'high-mag' : ''}`;
            card.innerHTML = `
                <span style="float:right; color:${color}; font-weight:bold;">M ${mag}</span>
                <h4>${place}</h4>
                <p>${dist.toFixed(0)} কিমি দূরে</p>
            `;
            card.onclick = () => {
                map.setView([lat, lon], 7);
                marker.openPopup();
                if(window.innerWidth <= 768) toggleSidebar(); // মোবাইলে ক্লিক করলে স্লাইডবার বন্ধ হবে
            };
            feed.appendChild(card);
        });

        updateUI(highestRisk, alarmTriggered);
    }

    function updateUI(risk, alarm) {
        const fill = document.getElementById('risk-fill');
        const status = document.getElementById('risk-status');
        const valText = document.getElementById('risk-val');
        const alarmBanner = document.getElementById('alarm-system');
        const audio = document.getElementById('alarm-audio');

        let pct = Math.min(risk * 15, 100);
        fill.style.width = pct + "%";
        valText.innerText = pct.toFixed(0) + "%";

        if (pct > 70) {
            fill.style.background = '#ff0055';
            status.innerText = "বিপজ্জনক অবস্থা!";
        } else if (pct > 30) {
            fill.style.background = '#ffaa00';
            status.innerText = "সতর্কতা প্রয়োজন";
        } else {
            fill.style.background = '#39ff14';
            status.innerText = "স্বাভাবিক";
        }

        if (alarm) {
            alarmBanner.style.display = 'block';
            audio.play().catch(() => {});
        } else {
            alarmBanner.style.display = 'none';
            audio.pause();
        }
    }

    function getDistance(la1, lo1, la2, lo2) {
        const R = 6371;
        const dLat = (la2-la1)*Math.PI/180;
        const dLon = (lo2-lo1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    window.onload = init;
</script>
</body>
</html>
